# Deployment for Render's free tier. One web service, no database, no build step.
#
# PYTHON_VERSION is pinned because the code uses `str | None` type syntax,
# which needs Python 3.10 or newer.
services:
  - type: web
    name: logic-puzzle-solver
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
